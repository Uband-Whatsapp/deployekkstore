<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — Kirim Notif</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ============================================================
   ADMIN OVERRIDE — EKK STORE MAIN BRAND
   Jangan mengubah fungsi / JS / ID yang sudah ada
   ============================================================ */

html,
body,
body.admin-page,
body.admin-page * {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

/* Font khusus angka / URL */
.stat-box-value,
.counter,
.pn-time,
.pn-url,
.login-input {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
}

/* Pastikan halaman admin benar-benar dark */
html[data-theme="dark"],
body.admin-page {
    background: #0a0a0d !important;
    color: #f2f2f5 !important;
}

/* ============================================================
   LOGIN — FIX WARNA & FONT
   ============================================================ */

#login-screen {
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(249, 115, 22, 0.12),
            transparent 45%
        ),
        #0a0a0d !important;

    color: #f2f2f5 !important;
}

#login-screen .login-card {
    background: #121216 !important;
    border: 1px solid #26262e !important;
    color: #f2f2f5 !important;
}

#login-screen h2,
#login-screen p,
#login-screen label,
#login-screen span {
    font-family: 'Inter', sans-serif !important;
}

#login-screen h2 {
    color: #f2f2f5 !important;
}

#login-screen p {
    color: #78788a !important;
}

#login-screen .login-input {
    background: #1a1a20 !important;
    color: #f2f2f5 !important;
    border-color: #26262e !important;
    font-family: 'JetBrains Mono', monospace !important;
}

#login-screen .login-input::placeholder {
    color: #52525e !important;
}

#login-screen .login-input:focus {
    border-color: #f97316 !important;
    box-shadow: 0 0 0 4px rgba(249,115,22,.16) !important;
}

#login-screen .login-btn {
    background: linear-gradient(
        135deg,
        #f97316,
        #ea580c
    ) !important;

    color: #ffffff !important;
    font-family: 'Inter', sans-serif !important;
}

#login-screen .login-error {
    color: #f0616b !important;
}

/* ============================================================
   HEADER
   ============================================================ */

.admin-header {
    background: rgba(10, 10, 13, 0.94) !important;
    border-bottom: 1px solid #26262e !important;
}

.admin-brand-title {
    color: #f2f2f5 !important;
    font-family: 'Inter', sans-serif !important;
}

.admin-brand-sub {
    color: #78788a !important;
}

.admin-brand-logo {
    background: linear-gradient(
        135deg,
        #f97316,
        #ea580c
    ) !important;

    box-shadow:
        0 6px 18px rgba(249,115,22,.25),
        0 0 0 1px rgba(255,255,255,.06) inset !important;
}

.admin-logout-btn {
    background: #1a1a20 !important;
    color: #b6b6c0 !important;
    border-color: #26262e !important;
    font-family: 'Inter', sans-serif !important;
}

.admin-logout-btn:hover {
    background: #2a1216 !important;
    color: #f0616b !important;
}

/* ============================================================
   PANEL HEADER
   ============================================================ */

#panel,
#panel * {
    font-family: 'Inter', system-ui, sans-serif;
}

.panel-header h1 {
    color: #f2f2f5 !important;
}

.panel-header p {
    color: #78788a !important;
}

.panel-header-icon {
    background: #2a1e16 !important;
    border-color: rgba(249,115,22,.28) !important;
    color: #f97316 !important;
}

/* Tag */
.panel-header h1 .tag {
    background: #2a1e16 !important;
    color: #f97316 !important;
    border-color: rgba(249,115,22,.28) !important;
}

/* ============================================================
   STATS
   ============================================================ */

.stat-box {
    background: #121216 !important;
    border-color: #26262e !important;
    color: #f2f2f5 !important;
}

.stat-box:hover {
    background: #16161b !important;
    border-color: #32323c !important;
}

.stat-box-value {
    color: #f2f2f5 !important;
}

.stat-box-label {
    color: #78788a !important;
}

.stat-box-icon {
    background: #2a1e16 !important;
    color: #f97316 !important;
}

.stat-box-icon.green {
    background: #0d2a22 !important;
    color: #22d3a8 !important;
}

.stat-box-icon.blue {
    background: #101e33 !important;
    color: #3b82f6 !important;
}

/* ============================================================
   FORM
   ============================================================ */

.form-card,
.preview-wrap {
    background: #121216 !important;
    border-color: #26262e !important;
    color: #f2f2f5 !important;
}

.form-label {
    color: #b6b6c0 !important;
}

.form-label i {
    color: #f97316 !important;
}

.form-input {
    background: #1a1a20 !important;
    color: #f2f2f5 !important;
    border-color: #26262e !important;
    font-family: 'Inter', sans-serif !important;
}

.form-input::placeholder {
    color: #52525e !important;
}

.form-input:focus {
    border-color: #f97316 !important;
    box-shadow: 0 0 0 4px rgba(249,115,22,.14) !important;
}

.form-hint {
    color: #78788a !important;
}

.counter {
    background: #2a1e16 !important;
    color: #f97316 !important;
}

/* ============================================================
   UPLOAD
   ============================================================ */

.upload-box {
    background: #1a1a20 !important;
    border-color: #32323c !important;
    color: #f2f2f5 !important;
}

.upload-box:hover,
.upload-box.dragover {
    background: #2a1e16 !important;
    border-color: #f97316 !important;
}

.upload-preview {
    background: #202027 !important;
    border-color: #32323c !important;
    color: #78788a !important;
}

.upload-title {
    color: #f2f2f5 !important;
}

.upload-hint {
    color: #78788a !important;
}

/* ============================================================
   SEND BUTTON
   ============================================================ */

.send-btn {
    background: linear-gradient(
        135deg,
        #f97316,
        #ea580c
    ) !important;

    color: #ffffff !important;
    font-family: 'Inter', sans-serif !important;

    box-shadow:
        0 8px 24px rgba(249,115,22,.25) !important;
}

.send-btn:hover:not(:disabled) {
    box-shadow:
        0 12px 30px rgba(249,115,22,.35) !important;
}

/* ============================================================
   PREVIEW
   ============================================================ */

.preview-wrap {
    background:
        linear-gradient(
            180deg,
            #121216,
            #0f0f13
        ) !important;
}

.preview-label {
    color: #78788a !important;
}

.phone-shell {
    background: #0a0a0d !important;
    border-color: #26262e !important;
}

.phone-notif {
    background:
        linear-gradient(
            180deg,
            #1a1a20,
            #121216
        ) !important;
}

/* ============================================================
   RESULT
   ============================================================ */

.result {
    font-family: 'Inter', sans-serif !important;
}

.result.success {
    background: #0d2a22 !important;
    color: #6ee7b7 !important;
}

.result.error {
    background: #2a1216 !important;
    color: #fca5a5 !important;
}

.result.loading {
    background: #101e33 !important;
    color: #93c5fd !important;
}

/* ============================================================
   MOBILE — 1 COLUMN, RAPI
   ============================================================ */

@media (max-width: 767px) {

    .admin-header {
        padding:
            max(10px, env(safe-area-inset-top))
            14px
            10px
            14px !important;
    }

    .admin-brand {
        gap: 10px;
        min-width: 0;
    }

    .admin-brand-logo {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        font-size: 15px;
    }

    .admin-brand-title {
        font-size: 14px !important;
    }

    .admin-brand-sub {
        font-size: 9px !important;
    }

    .header-actions {
        gap: 6px;
    }

    .sub-chip {
        padding: 6px 9px !important;
        font-size: 10px !important;
    }

    .admin-logout-btn {
        width: 36px;
        height: 36px;
        padding: 0 !important;
        justify-content: center;
    }

    .admin-logout-btn span {
        display: none !important;
    }

    #panel {
        width: 100%;
        box-sizing: border-box;
        padding:
            20px
            14px
            calc(60px + env(safe-area-inset-bottom))
            !important;
    }

    .panel-header {
        gap: 11px;
        margin-bottom: 18px;
        padding-bottom: 16px;
    }

    .panel-header-icon {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        font-size: 16px;
    }

    .panel-header h1 {
        font-size: 19px !important;
        line-height: 1.2;
        gap: 7px;
    }

    .panel-header h1 .tag {
        font-size: 9px;
        padding: 4px 8px;
    }

    .panel-header p {
        font-size: 11.5px;
        line-height: 1.4;
    }

    /* Stats tetap 2 kolom */
    .stats-row {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 10px !important;
        margin-bottom: 16px;
    }

    .stat-box {
        min-width: 0;
        padding: 13px 12px !important;
        border-radius: 14px;
        gap: 9px;
    }

    .stat-box-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-size: 13px;
    }

    .stat-box-value {
        font-size: 18px !important;
    }

    .stat-box-label {
        font-size: 9px !important;
        letter-spacing: .04em;
    }

    /* Form */
    .grid-2 {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
    }

    .form-card {
        padding: 17px 15px !important;
        border-radius: 17px;
    }

    .form-group {
        margin-bottom: 16px;
        gap: 7px;
    }

    .form-label {
        font-size: 10.5px !important;
    }

    .form-input {
        font-size: 14px !important;
        padding: 12px 13px !important;
        border-radius: 10px;
    }

    .send-btn {
        min-height: 52px;
        margin-top: 20px;
        border-radius: 12px;
        font-size: 13.5px;
    }

    /* Preview */
    .preview-wrap {
        padding: 18px 13px 20px !important;
        border-radius: 18px;
    }

    .phone-shell {
        border-radius: 23px;
        padding: 12px 10px 13px;
    }

    .phone-notif {
        border-radius: 17px;
        padding: 12px;
    }

    .pn-title {
        font-size: 13px;
    }

    .pn-body {
        font-size: 11px;
    }
}

/* HP kecil */
@media (max-width: 380px) {

    .admin-brand-sub {
        display: none;
    }

    .sub-chip {
        padding: 6px 8px !important;
    }

    .stats-row {
        gap: 8px !important;
    }

    .stat-box {
        padding: 11px 9px !important;
    }

    .stat-box-icon {
        width: 32px;
        height: 32px;
    }

    .stat-box-value {
        font-size: 17px !important;
    }

    .stat-box-label {
        font-size: 8px !important;
    }

    .panel-header h1 {
        font-size: 18px !important;
    }
}
</style>
</head>
<body class="admin-page">

<div id="login-screen">
  <div class="login-card">
    <div class="login-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h2>Admin Panel</h2>
    <p>Masukkan password untuk mengakses panel notifikasi.</p>
    <input type="password" id="admin-password" class="login-input" placeholder="••••••••" autocomplete="off">
    <button id="login-btn" class="login-btn"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
    <div id="login-error" class="login-error">Password salah. Coba lagi.</div>
  </div>
</div>

<header class="admin-header" id="admin-header" style="display:none;">
  <div class="admin-brand">
    <div class="admin-brand-logo"><i class="fa-solid fa-bell"></i></div>
    <div class="admin-brand-text">
      <span class="admin-brand-title">Ekk Store</span>
      <span class="admin-brand-sub">Admin Panel</span>
    </div>
  </div>
  <div class="header-actions">
    <span class="sub-chip"><i class="fa-solid fa-users"></i> <span id="sub-count">—</span></span>
    <button class="logout-btn" id="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Keluar</span></button>
  </div>
</header>

<main id="panel">
  <div class="page-header">
    <div class="page-header-icon"><i class="fa-solid fa-paper-plane"></i></div>
    <div>
      <h1>Kirim Notifikasi</h1>
      <p>Isi judul dan isi notif, lalu kirim ke semua subscriber.</p>
    </div>
  </div>

  <div class="card-x">
    <div class="form-group">
      <label class="form-label" for="title"><i class="fa-solid fa-heading"></i> Judul Notifikasi</label>
      <input type="text" id="title" class="form-input" placeholder="contoh: Ekk Store Update" maxlength="60">
      <span class="form-hint"><span class="counter" id="title-c">0</span> / 60 karakter</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="body"><i class="fa-solid fa-align-left"></i> Isi Notifikasi</label>
      <textarea id="body" class="form-input" placeholder="Tulis pesan singkat..." maxlength="180" rows="3" style="resize:vertical;min-height:85px;"></textarea>
      <span class="form-hint"><span class="counter" id="body-c">0</span> / 180 karakter</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="url"><i class="fa-solid fa-link"></i> URL Tujuan</label>
      <input type="url" id="url" class="form-input" placeholder="https://deploy.project.ekkstore.web.id/" value="https://deploy.project.ekkstore.web.id/">
    </div>

    <div class="form-group">
      <label class="form-label"><i class="fa-solid fa-image"></i> Gambar (opsional)</label>
      <div class="upload-box" id="upload-box">
        <div class="upload-preview" id="upload-preview"><i class="fa-solid fa-image"></i></div>
        <div class="upload-info">
          <div class="upload-title" id="upload-title">Tap untuk upload gambar</div>
          <div class="upload-hint" id="upload-hint">JPG / PNG · Max 3 MB</div>
        </div>
        <button type="button" class="upload-remove" id="upload-remove"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="file" id="image-input" accept="image/*" style="display:none;">
    </div>

    <button class="send-btn" id="btn-send"><i class="fa-solid fa-paper-plane"></i> Kirim ke Semua Subscriber</button>

    <div class="result" id="result"><i id="result-icon"></i><span id="result-text"></span></div>
  </div>
</main>

<div id="toast"></div>
<script src="/js/admin.js"></script>
</body>
</html>
